<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Valley — Farm Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#2f7d4f; --brand-dark:#1f5c38; --brand-light:#e8f5ec; --accent:#d97706; }
  * { font-family: 'Inter', system-ui, sans-serif; }
  body { background:#f4f7f5; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#c7d2cc; border-radius:4px; }
  .nav-item.active { background: var(--brand-light); color: var(--brand-dark); font-weight:600; }
  .nav-item.active svg { stroke: var(--brand-dark); }
  .card { background:white; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid #eef1ef; }
  .btn-primary { background:var(--brand); color:white; }
  .btn-primary:hover { background:var(--brand-dark); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  table.data-table th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:#6b7280; padding:10px 12px; border-bottom:1px solid #eef1ef; }
  table.data-table td { padding:10px 12px; border-bottom:1px solid #f3f4f6; font-size:14px; }
  table.data-table tr:hover td { background:#fafbfa; }
  .modal-backdrop { background:rgba(15,23,20,.45); }
  input, select, textarea { border:1px solid #d9dfdb; border-radius:8px; padding:8px 10px; font-size:14px; width:100%; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand); }
  label { font-size:12px; font-weight:600; color:#4b5a50; display:block; margin-bottom:4px; }
  .tab-btn.active { border-bottom:2px solid var(--brand); color:var(--brand-dark); font-weight:600; }
</style>
</head>
<body class="text-gray-800">
<div id="app"></div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/modules.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
